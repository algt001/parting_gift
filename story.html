
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE 001 — Материалы дела</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #ddd;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

#video {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;
    object-fit: contain;
    background: #000;
    transform: scale(1.12);
    opacity: 0;
    transition: opacity 1.2s ease;
}

#video.visible {
    opacity: 1;
}

#shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
        linear-gradient(to bottom, rgba(0,0,0,.15), transparent 25%, transparent 70%, rgba(0,0,0,.6)),
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.6) 100%);
}

#noise {
    position: absolute;
    inset: -50%;
    z-index: 3;
    pointer-events: none;
    opacity: .12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    animation: noiseMove .2s steps(2) infinite;
}

@keyframes noiseMove {
    0% { transform: translate(0, 0); }
    25% { transform: translate(2%, -1%); }
    50% { transform: translate(-1%, 2%); }
    75% { transform: translate(1%, 1%); }
    100% { transform: translate(-2%, -1%); }
}

#subtitle {
    position: absolute;
    z-index: 5;
    left: 7%;
    right: 7%;
    bottom: 10%;
    min-height: 3em;
    text-align: center;
    color: #ddd;
    font-size: clamp(15px, 2.2vw, 23px);
    line-height: 1.5;
    text-shadow: 0 2px 5px #000, 0 0 10px #000;
    white-space: pre-line;
}

#status {
    position: absolute;
    z-index: 5;
    top: 22px;
    left: 24px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: .75;
}

#hint {
    position: absolute;
    z-index: 5;
    right: 20px;
    bottom: 20px;
    color: #777;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: right;
}

#end {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
}

#end h1 {
    color: #aaa;
    font-size: clamp(20px, 4vw, 34px);
    font-weight: normal;
    letter-spacing: 5px;
}

#end p {
    color: #666;
    font-size: 13px;
    line-height: 1.8;
}

#restart {
    margin-top: 24px;
    padding: 12px 22px;
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    font: inherit;
    cursor: pointer;
}

#restart:hover {
    color: #fff;
    border-color: #aaa;
}

@keyframes zoomOut {
    from { transform: scale(1.12); }
    to { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
    #noise {
        animation: none;
    }
}
</style>
</head>

<body>
<div id="screen">
    <video id="video" playsinline preload="auto"></video>

    <div id="shade"></div>
    <div id="noise"></div>

    <div id="status">CASE 001 // МАТЕРИАЛЫ ДЕЛА</div>
    <div id="subtitle"></div>
    <div id="hint">ДВОЙНОЙ КЛИК — ПРОПУСТИТЬ ФРАГМЕНТ</div>

    <div id="end">
        <h1>КОНЕЦ МАТЕРИАЛОВ</h1>
        <p>CASE 001<br>ДОПОЛНИТЕЛЬНЫЕ МАТЕРИАЛЫ ОТСУТСТВУЮТ</p>
        <button id="restart">ПЕРЕСМОТРЕТЬ</button>
    </div>
</div>

<audio id="voice" preload="auto"></audio>

<script>
"use strict";

/*
  Все файлы должны лежать в одной папке с story.html.
  video1.mp4 — без озвучки.
*/

const scenes = [
    {
        video: "video1.mp4",
        voices: [],
        subtitles: []
    },
    {
        video: "video2.mp4",
        voices: [
            {
                file: "voice2a.mp3",
                text: "Тело несовершеннолетней было обнаружено в собственном доме. По предварительным данным, смерть могла выглядеть как самоубийство через повешение."
            },
            {
                file: "voice2b.mp3",
                text: "Однако при первичном осмотре на шее погибшей обнаружены следы сдавливания, характер которых вызывает сомнения в первоначальной версии произошедшего."
            }
        ]
    },
    {
        video: "video3.mp4",
        voices: [
            {
                file: "voice3.mp3",
                text: "Предварительное заключение: имеющихся данных недостаточно для однозначного вывода о самоубийстве. Версия насильственной смерти не исключена."
            }
        ]
    },
    {
        video: "video4.mp4",
        voices: [
            {
                file: "voice4.mp3",
                text: "Следы требуют дополнительной судебно-медицинской экспертизы. На данный момент установить, были ли они получены до смерти или возникли при иных обстоятельствах, не представляется возможным."
            }
        ]
    }
];

const STORAGE_KEY = "case001_storyCheckpoint";

const screen = document.getElementById("screen");
const video = document.getElementById("video");
const voice = document.getElementById("voice");
const subtitle = document.getElementById("subtitle");
const status = document.getElementById("status");
const endScreen = document.getElementById("end");
const restartButton = document.getElementById("restart");

let sceneIndex = 0;
let sceneToken = 0;
let voiceIndex = 0;
let timers = [];
let videoFinished = false;
let voicesFinished = false;
let waitingForGesture = false;
let ended = false;
let lastTapTime = 0;
let voicePlayToken = 0;

/*
  СОХРАНЕНИЕ ТОЛЬКО В КОНТРОЛЬНЫХ ТОЧКАХ.

  Когда понадобится сохранить прогресс в конкретной точке,
  вызови saveCheckpoint(номерСледующейСцены).

  Например:
  saveCheckpoint(2);

  Это сохранит начало третьего фрагмента.
  Автоматического сохранения после каждой сцены нет.
*/

function saveCheckpoint(nextSceneIndex) {
    localStorage.setItem(
        STORAGE_KEY,
        String(nextSceneIndex)
    );
}

function loadCheckpoint() {
    const saved = Number(
        localStorage.getItem(STORAGE_KEY)
    );

    if (
        Number.isInteger(saved) &&
        saved >= 0 &&
        saved < scenes.length
    ) {
        return saved;
    }

    return 0;
}

function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
}

function later(callback, delay) {
    const id = setTimeout(callback, delay);
    timers.push(id);
    return id;
}

function stopVoice() {
    voicePlayToken++;
    voice.pause();

    try {
        voice.currentTime = 0;
    } catch (_) {}

    voice.removeAttribute("src");
    voice.load();
}

function stopVideo() {
    video.pause();
    video.onended = null;
    video.onerror = null;
    video.onloadeddata = null;

    try {
        video.currentTime = 0;
    } catch (_) {}

    video.removeAttribute("src");
    video.load();
}

function resetSceneState() {
    clearTimers();
    stopVoice();
    stopVideo();

    voiceIndex = 0;
    videoFinished = false;
    voicesFinished = false;
    waitingForGesture = false;

    subtitle.textContent = "";
    video.classList.remove("visible");
}

async function startScene(index) {
    if (index < 0 || index >= scenes.length) {
        showEnding();
        return;
    }

    sceneToken++;
    const token = sceneToken;

    resetSceneState();

    sceneIndex = index;
    ended = false;
    endScreen.style.display = "none";

    const scene = scenes[sceneIndex];

    status.textContent =
        "CASE 001 // МАТЕРИАЛ " +
        String(sceneIndex + 1).padStart(2, "0");

    video.style.animation = "none";
    void video.offsetWidth;
    video.style.animation = "zoomOut 12s linear forwards";

    video.src = scene.video;
    video.load();

    video.onloadeddata = async () => {
        if (token !== sceneToken) return;

        video.classList.add("visible");

        try {
            await video.play();
        } catch (_) {
            waitingForGesture = true;
        }

        if (token !== sceneToken) return;

        if (scene.voices.length > 0) {
            playVoice(token);
        } else {
            voicesFinished = true;
            subtitle.textContent = "";
            checkSceneComplete(token);
        }
    };

    video.onended = () => {
        if (token !== sceneToken) return;

        videoFinished = true;
        freezeLastFrame();
        checkSceneComplete(token);
    };

    video.onerror = () => {
        if (token !== sceneToken) return;

        subtitle.textContent = "[ОШИБКА ЗАГРУЗКИ ВИДЕО]";
        videoFinished = true;

        if (scene.voices.length === 0) {
            voicesFinished = true;
        }

        checkSceneComplete(token);
    };
}

function freezeLastFrame() {
    video.pause();

    try {
        if (Number.isFinite(video.duration) && video.duration > 0) {
            video.currentTime = Math.max(0, video.duration - 0.04);
        }
    } catch (_) {}
}

async function playVoice(token) {
    if (token !== sceneToken) return;

    const scene = scenes[sceneIndex];

    if (voiceIndex >= scene.voices.length) {
        voicesFinished = true;
        subtitle.textContent = "";
        checkSceneComplete(token);
        return;
    }

    const currentVoice = scene.voices[voiceIndex];
    const thisVoiceToken = ++voicePlayToken;

    voice.pause();
    voice.src = currentVoice.file;
    voice.load();

    subtitle.textContent = currentVoice.text;

    voice.onended = () => {
        if (
            token !== sceneToken ||
            thisVoiceToken !== voicePlayToken
        ) return;

        voiceIndex++;

        if (voiceIndex < scene.voices.length) {
            playVoice(token);
        } else {
            voicesFinished = true;
            subtitle.textContent = "";
            checkSceneComplete(token);
        }
    };

    voice.onerror = () => {
        if (
            token !== sceneToken ||
            thisVoiceToken !== voicePlayToken
        ) return;

        voiceIndex++;

        if (voiceIndex < scene.voices.length) {
            playVoice(token);
        } else {
            voicesFinished = true;
            subtitle.textContent = "";
            checkSceneComplete(token);
        }
    };

    try {
        await voice.play();
        waitingForGesture = false;
    } catch (_) {
        waitingForGesture = true;
    }
}

function checkSceneComplete(token) {
    if (token !== sceneToken) return;

    /*
      Не переключаем сцену автоматически.
      Когда видео закончилось, последний кадр остаётся на экране,
      пока пользователь не пропустит фрагмент двойным кликом.
    */

    if (videoFinished && voicesFinished) {
        subtitle.textContent = " ";
    }
}

function skipScene() {
    if (ended) return;

    sceneToken++;
    clearTimers();
    stopVoice();
    stopVideo();

    subtitle.textContent = "";

    if (sceneIndex + 1 < scenes.length) {
        startScene(sceneIndex + 1);
    } else {
        showEnding();
    }
}

function showEnding() {
    ended = true;
    sceneToken++;

    clearTimers();
    stopVoice();
    stopVideo();

    subtitle.textContent = "";
    video.classList.remove("visible");
    status.textContent = "CASE 001 // ЗАВЕРШЕНО";
    endScreen.style.display = "flex";
}

function restartStory() {
    localStorage.removeItem(STORAGE_KEY);
    startScene(0);
}

/*
  Двойной клик / двойной тап пропускает текущий фрагмент.
  Одиночный тап не переключает сцену.
  Если браузер заблокировал запуск медиа, первый тап пытается
  запустить видео и озвучку, а двойной тап пропускает фрагмент.
*/

screen.addEventListener("pointerup", async (event) => {
    if (event.target.closest("#restart")) return;
    if (ended) return;

    const now = Date.now();

    if (now - lastTapTime <= 350) {
        lastTapTime = 0;
        skipScene();
        return;
    }

    lastTapTime = now;

    if (waitingForGesture) {
        try {
            waitingForGesture = false;

            if (
                voice.getAttribute("src") &&
                !voicesFinished
            ) {
                await voice.play();
            } else if (!videoFinished) {
                await video.play();
            }
        } catch (_) {
            waitingForGesture = true;
        }
    }
});

restartButton.addEventListener("click", (event) => {
    event.stopPropagation();
    restartStory();
});

/*
  При желании можно вручную начать с последней контрольной точки:
  замени startScene(0) на startScene(loadCheckpoint()).
  По умолчанию история всегда начинается сначала.
*/

startScene(0);
</script>
</body>
</html>
