
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASE 001 — Архив</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #ccc;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 0;
    transform: scale(1.12);
}

#video.visible {
    opacity: 1;
}

.zoom {
    animation: zoomOut 12s linear forwards;
}

@keyframes zoomOut {
    from { transform: scale(1.12); }
    to { transform: scale(1); }
}

#shade {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        linear-gradient(to bottom, #0005, transparent 25%, transparent 70%, #0009),
        radial-gradient(ellipse at center, transparent 35%, #0009 100%);
}

#noise {
    position: absolute;
    inset: -50%;
    z-index: 3;
    pointer-events: none;
    opacity: .12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    animation: noiseMove .2s steps(2) infinite;
}

@keyframes noiseMove {
    0% { transform: translate(0,0); }
    25% { transform: translate(2%,-1%); }
    50% { transform: translate(-1%,2%); }
    75% { transform: translate(1%,1%); }
    100% { transform: translate(-2%,-1%); }
}

#status {
    position: absolute;
    top: 22px;
    left: 24px;
    z-index: 5;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
}

#subtitle {
    position: absolute;
    z-index: 5;
    left: 7%;
    right: 7%;
    bottom: 10%;
    text-align: center;
    color: #ddd;
    font-size: clamp(15px, 2.2vw, 23px);
    line-height: 1.5;
    text-shadow: 0 2px 5px #000, 0 0 10px #000;
}

#hint {
    position: absolute;
    z-index: 5;
    bottom: 20px;
    right: 20px;
    color: #777;
    font-size: 11px;
    text-align: right;
}

#end {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
}

#end h1 {
    color: #aaa;
    font-size: clamp(20px, 4vw, 34px);
    font-weight: normal;
    letter-spacing: 5px;
}

#end p {
    color: #666;
    font-size: 13px;
    line-height: 1.8;
}

#restart {
    margin-top: 24px;
    padding: 12px 22px;
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    font: inherit;
}

</style>
</head>

<body>
<div id="screen">
    <video id="video" playsinline preload="auto"></video>
    <div id="shade"></div>
    <div id="noise"></div>

    <div id="status">CASE 001 // МАТЕРИАЛЫ ДЕЛА</div>
    <div id="subtitle"></div>
    <div id="hint">ДВОЙНОЙ КЛИК — ПРОПУСТИТЬ</div>

    <div id="end">
        <h1>КОНЕЦ МАТЕРИАЛОВ</h1>
        <p>CASE 001<br>ДОПОЛНИТЕЛЬНЫЕ МАТЕРИАЛЫ ОТСУТСТВУЮТ</p>
        <button id="restart">ПЕРЕСМОТРЕТЬ</button>
    </div>
</div>

<audio id="voice" preload="auto"></audio>

<script>
const scenes = [
    {
        video: "video1.mp4",
        voices: []
    },
    {
        video: "video2.mp4",
        voices: [
            {
                file: "voice2a.mp3",
                text: "Тело несовершеннолетней было обнаружено в собственном доме. По предварительным данным, смерть могла выглядеть как самоубийство через повешение."
            },
            {
                file: "voice2b.mp3",
                text: "Однако при первичном осмотре на шее погибшей обнаружены следы сдавливания, характер которых вызывает сомнения в первоначальной версии произошедшего."
            }
        ]
    },
    {
        video: "video3.mp4",
        voices: [
            {
                file: "voice3.mp3",
                text: "Предварительное заключение: имеющихся данных недостаточно для однозначного вывода о самоубийстве. Версия насильственной смерти не исключена."
            }
        ]
    },
    {
        video: "video4.mp4",
        voices: [
            {
                file: "voice4.mp3",
                text: "Следы требуют дополнительной судебно-медицинской экспертизы. На данный момент установить, были ли они получены до смерти или возникли при иных обстоятельствах, не представляется возможным."
            }
        ]
    }
];

const screen = document.getElementById("screen");
const video = document.getElementById("video");
const voice = document.getElementById("voice");
const subtitle = document.getElementById("subtitle");
const status = document.getElementById("status");
const end = document.getElementById("end");

let sceneIndex = 0;
let token = 0;
let voiceIndex = 0;
let voiceToken = 0;
let voicesFinished = false;
let videoFinished = false;
let waitingForGesture = false;
let ended = false;
let lastTap = 0;

function stopVoice() {
    voiceToken++;
    voice.pause();
    voice.removeAttribute("src");
    voice.load();
    voice.onended = null;
    voice.onerror = null;
}

function stopVideo() {
    video.pause();
    video.onended = null;
    video.onerror = null;
    video.onloadeddata = null;
    video.removeAttribute("src");
    video.load();
}

function startScene(index) {
    if (index >= scenes.length) {
        showEnding();
        return;
    }

    token++;
    const currentToken = token;

    stopVoice();
    stopVideo();

    sceneIndex = index;
    voiceIndex = 0;
    voicesFinished = false;
    videoFinished = false;
    waitingForGesture = false;
    ended = false;

    subtitle.textContent = "";
    end.style.display = "none";
    video.classList.remove("visible");

    const scene = scenes[index];

    status.textContent =
        "CASE 001 // МАТЕРИАЛ " + String(index + 1).padStart(2, "0");

    video.style.animation = "none";
    video.src = scene.video;
    video.load();

    video.onloadeddata = async () => {
        if (currentToken !== token) return;

        video.classList.add("visible");
        video.style.animation = "none";
        void video.offsetWidth;
        video.classList.add("zoom");

        try {
            await video.play();
        } catch (_) {
            waitingForGesture = true;
        }

        if (currentToken !== token) return;

        if (scene.voices.length === 0) {
            voicesFinished = true;
            checkComplete(currentToken);
        } else {
            playVoice(currentToken);
        }
    };

    video.onended = () => {
        if (currentToken !== token) return;

        videoFinished = true;
        video.pause();

        try {
            video.currentTime = Math.max(0, video.duration - 0.04);
        } catch (_) {}

        checkComplete(currentToken);
    };

    video.onerror = () => {
        if (currentToken !== token) return;
        subtitle.textContent = "[ОШИБКА ЗАГРУЗКИ ВИДЕО]";
    };
}

async function playVoice(currentToken) {
    if (currentToken !== token) return;

    const scene = scenes[sceneIndex];

    if (voiceIndex >= scene.voices.length) {
        voicesFinished = true;
        subtitle.textContent = "";
        checkComplete(currentToken);
        return;
    }

    const item = scene.voices[voiceIndex];
    const currentVoiceToken = ++voiceToken;

    voice.pause();
    voice.src = item.file;
    voice.load();
    subtitle.textContent = item.text;

    voice.onended = () => {
        if (
            currentToken !== token ||
            currentVoiceToken !== voiceToken
        ) return;

        voiceIndex++;
        playVoice(currentToken);
    };

    voice.onerror = () => {
        if (
            currentToken !== token ||
            currentVoiceToken !== voiceToken
        ) return;

        voiceIndex++;
        playVoice(currentToken);
    };

    try {
        await voice.play();
        waitingForGesture = false;
    } catch (_) {
        waitingForGesture = true;
    }
}

function checkComplete(currentToken) {
    if (currentToken !== token) return;

    // Сцена не переключается автоматически.
    // Последний кадр остаётся, пока пользователь не сделает двойной тап.
    if (videoFinished && voicesFinished) {
        subtitle.textContent = "";
    }
}

function skipScene() {
    if (ended) return;

    token++;
    stopVoice();
    stopVideo();

    subtitle.textContent = "";

    if (sceneIndex < scenes.length - 1) {
        startScene(sceneIndex + 1);
    } else {
        showEnding();
    }
}

function showEnding() {
    token++;
    stopVoice();
    stopVideo();

    ended = true;
    subtitle.textContent = "";
    status.textContent = "CASE 001 // ЗАВЕРШЕНО";
    video.classList.remove("visible");
    end.style.display = "flex";

    // Полный сброс прогресса: ничего не сохраняется.
    localStorage.removeItem("case001_storyCheckpoint");
}

screen.addEventListener("pointerup", async (event) => {
    if (event.target.closest("#restart") || ended) return;

    const now = Date.now();

    if (now - lastTap <= 350) {
        lastTap = 0;
        skipScene();
        return;
    }

    lastTap = now;

    if (waitingForGesture) {
        try {
            waitingForGesture = false;

            if (voice.getAttribute("src") && !voicesFinished) {
                await voice.play();
            } else if (!videoFinished) {
                await video.play();
            }
        } catch (_) {
            waitingForGesture = true;
        }
    }
});

document.getElementById("restart").addEventListener("click", () => {
    // Перезапуск тоже полностью начинает историю сначала.
    localStorage.removeItem("case001_storyCheckpoint");
    startScene(0);
});

startScene(0);
</script>
</body>
</html>
