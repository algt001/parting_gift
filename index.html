<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE 001</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font-family:"Courier New",monospace;overflow:hidden}
#screen{position:relative;width:100vw;height:100dvh;background:#000;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent}
#video{width:100%;height:100%;object-fit:contain;background:#000}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 25%,transparent 65%,rgba(0,0,0,.75))}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
#caption{position:absolute;bottom:12%;left:7%;right:7%;text-align:center;font-size:clamp(15px,2.4vw,23px);line-height:1.5;color:#eee;text-shadow:0 2px 5px #000,0 0 8px #000;white-space:pre-line;pointer-events:none}
#hint{position:absolute;bottom:3%;left:0;right:0;text-align:center;color:#888;font-size:12px;letter-spacing:2px;opacity:0;transition:opacity 1s;pointer-events:none}
#hint.visible{opacity:1}
#case{position:absolute;top:4%;left:4%;color:#888;font-size:12px;letter-spacing:2px;pointer-events:none}
#error{display:none;position:absolute;inset:0;background:#000;padding:30px;align-items:center;justify-content:center;text-align:center;line-height:1.7;color:#aaa;z-index:5}
</style>
</head>
<body>
<div id="screen">
  <video id="video" playsinline preload="auto"></video>
  <div id="shade"></div><div id="grain"></div>
  <div id="case">CASE 001 // ARCHIVE</div>
  <div id="caption"></div>
  <div id="hint">[ ДВОЙНОЕ НАЖАТИЕ — ПРОПУСТИТЬ ФРАГМЕНТ ]</div>
  <div id="error">Не удалось загрузить видео.<br>Проверь названия файлов и их расположение в репозитории.</div>
</div>
<audio id="voice"></audio>
<script>
/*
Все файлы должны лежать в одной папке со story.html:
video1.mp4, video2.mp4, video3.mp4, video4.mp4
voice2a.mp3, voice2b.mp3, voice3.mp3, voice4.mp3
*/
const scenes = [
  {video:"video1.mp4", audio:[], subtitles:[]},
  {video:"video2.mp4", audio:["voice2a.mp3","voice2b.mp3"], subtitles:[
    {start:0,end:13,text:"Тело несовершеннолетней было обнаружено в собственном доме. По предварительным данным, смерть могла выглядеть как самоубийство через повешение."},
    {start:13,end:18,text:"Однако при первичном осмотре на шее погибшей обнаружены следы сдавливания, характер которых вызывает сомнения в первоначальной версии произошедшего."}
  ]},
  {video:"video3.mp4", audio:["voice3.mp3"], subtitles:[
    {start:0,end:9,text:"Предварительное заключение: имеющихся данных недостаточно для однозначного вывода о самоубийстве. Версия насильственной смерти не исключена."}
  ]},
  {video:"video4.mp4", audio:["voice4.mp3"], subtitles:[
    {start:0,end:12,text:"Следы требуют дополнительной судебно-медицинской экспертизы. На данный момент установить, были ли они получены до смерти или возникли при иных обстоятельствах, не представляется возможным."}
  ]}
];
const video=document.getElementById("video"), voice=document.getElementById("voice");
const caption=document.getElementById("caption"), hint=document.getElementById("hint");
const errorBox=document.getElementById("error");
const STORAGE_KEY="case001_storyScene";
let sceneIndex=parseInt(localStorage.getItem(STORAGE_KEY)||"0",10);
if(!Number.isFinite(sceneIndex)||sceneIndex<0||sceneIndex>=scenes.length) sceneIndex=0;
let audioIndex=0,audioFinished=false,videoFinished=false,frozen=false,waitingForGesture=false;
let sceneToken=0,subtitleTimer=null,lastTap=0,advancing=false;

function saveProgress(){localStorage.setItem(STORAGE_KEY,String(sceneIndex))}
function stopTimers(){clearInterval(subtitleTimer);subtitleTimer=null}
function showSubtitle(text){caption.textContent=text||""}

function startScene(){
  const token=++sceneToken;
  stopTimers();
  const scene=scenes[sceneIndex];
  audioIndex=0;audioFinished=scene.audio.length===0;videoFinished=false;frozen=false;
  waitingForGesture=false;advancing=false;
  caption.textContent="";hint.classList.remove("visible");
  hint.textContent="[ ДВОЙНОЕ НАЖАТИЕ — ПРОПУСТИТЬ ФРАГМЕНТ ]";errorBox.style.display="none";
  saveProgress();
  voice.pause();voice.removeAttribute("src");voice.load();
  video.pause();video.removeAttribute("src");video.load();
  video.src=scene.video;video.load();
  video.onloadeddata=async()=>{
    if(token!==sceneToken)return;
    try{await video.play()}catch(e){
      if(token!==sceneToken)return;
      waitingForGesture=true;showSubtitle("[ НАЖМИТЕ, ЧТОБЫ НАЧАТЬ ]");
    }
    if(scene.audio.length) playVoice(token);
    else{audioFinished=true;checkSceneEnd()}
  };
  video.onerror=()=>{if(token===sceneToken)errorBox.style.display="flex"};
}
function playVoice(token){
  const scene=scenes[sceneIndex];
  if(token!==sceneToken)return;
  if(audioIndex>=scene.audio.length){audioFinished=true;showSubtitle("");checkSceneEnd();return}
  voice.pause();voice.currentTime=0;voice.src=scene.audio[audioIndex];voice.load();
  voice.onloadedmetadata=()=>{
    if(token!==sceneToken)return;
    voice.play().catch(()=>{
      if(token!==sceneToken)return;
      waitingForGesture=true;showSubtitle("[ НАЖМИТЕ, ЧТОБЫ ВОЗОБНОВИТЬ ЗВУК ]");
    });
    updateSubtitle(token);stopTimers();subtitleTimer=setInterval(()=>updateSubtitle(token),100);
  };
  voice.onended=()=>{
    if(token!==sceneToken)return;
    stopTimers();audioIndex++;
    if(audioIndex<scene.audio.length)playVoice(token);
    else{audioFinished=true;showSubtitle("");checkSceneEnd()}
  };
  voice.onerror=()=>{
    if(token!==sceneToken)return;
    stopTimers();audioFinished=true;showSubtitle("[ ОШИБКА ЗАГРУЗКИ АУДИО ]");checkSceneEnd();
  };
}
function updateSubtitle(token){
  if(token!==sceneToken)return;
  const scene=scenes[sceneIndex];let time=voice.currentTime;
  if(sceneIndex===1&&audioIndex===1)time+=13;
  const line=scene.subtitles.find(item=>time>=item.start&&time<item.end);
  showSubtitle(line?line.text:"");
}
function freezeLastFrame(){
  if(frozen)return;frozen=true;
  if(Number.isFinite(video.duration)&&video.duration>0){
    try{video.currentTime=Math.max(0,video.duration-0.04)}catch(e){}
  }
  video.pause();
}
video.addEventListener("ended",()=>{videoFinished=true;freezeLastFrame();checkSceneEnd()});
video.addEventListener("timeupdate",()=>{
  if(Number.isFinite(video.duration)&&video.duration>0&&video.currentTime>=video.duration-0.04&&!videoFinished){
    videoFinished=true;freezeLastFrame();checkSceneEnd();
  }
});
function checkSceneEnd(){if(videoFinished&&audioFinished)hint.classList.add("visible")}

function skipScene(){
  if(advancing)return;advancing=true;
  voice.pause();voice.removeAttribute("src");voice.load();
  stopTimers();caption.textContent="";
  video.pause();
  if(sceneIndex<scenes.length-1){
    sceneIndex++;saveProgress();startScene();
  }else{
    localStorage.setItem("case001_storyFinished","true");
    hint.textContent="[ АРХИВ ЗАВЕРШЁН ]";hint.classList.add("visible");
  }
}
document.getElementById("screen").addEventListener("click",async()=>{
  const now=Date.now();
  if(waitingForGesture){
    waitingForGesture=false;
    try{
      if(voice.src&&!audioFinished){await voice.play();updateSubtitle(sceneToken)}
      else if(!videoFinished)await video.play();
    }catch(e){waitingForGesture=true}
    lastTap=0;return;
  }
  if(now-lastTap<350){lastTap=0;skipScene()}
  else lastTap=now;
});
window.addEventListener("beforeunload",saveProgress);
startScene();
</script>
</body>
</html>
