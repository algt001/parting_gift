<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#screen {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #030303;
  isolation: isolate;
}

#face {
  position: absolute;
  inset: -5%;
  width: 110%;
  height: 110%;
  object-fit: cover;
  object-position: center 35%;
  filter: grayscale(1) contrast(1.3) brightness(.65);
  animation: breathing 7s ease-in-out infinite,
             shaking 11s steps(1) infinite;
  user-select: none;
  pointer-events: none;
}

#vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse,
    transparent 25%,
    #0008 65%,
    #000 110%
  );
  pointer-events: none;
}

#scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    #fff 3px,
    transparent 4px
  );
}

#noise {
  position: absolute;
  inset: -50%;
  width: 200%;
  height: 200%;
  opacity: .12;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation: noiseMove .2s steps(2) infinite;
}

#glitch {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: transparent;
  animation: glitch 8s infinite;
}

#play {
  position: absolute;
  left: 50%;
  top: 57%;
  transform: translate(-50%, -50%);
  z-index: 5;
  padding: 18px 25px;
  border: 0;
  outline: 0;
  color: #ddd;
  background: transparent;
  font: 24px monospace;
  letter-spacing: 9px;
  cursor: pointer;
  text-shadow: 0 0 8px #fff8;
  animation: flicker 4s infinite;
  -webkit-tap-highlight-color: transparent;
}

#play:hover {
  color: white;
  text-shadow: 0 0 14px white;
}

#play:active {
  color: #777;
}

#ending {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 10;
  background: black;
  color: #aaa;
  align-items: center;
  justify-content: center;
  font: 13px monospace;
  letter-spacing: 4px;
  text-align: center;
  animation: appear .8s forwards;
}

@keyframes breathing {
  0%, 100% { transform: scale(1) translate(0, 0); }
  50% { transform: scale(1.09) translate(-.5%, .3%); }
}

@keyframes shaking {
  0%, 89%, 91%, 95%, 100% {
    translate: 0 0;
    filter: grayscale(1) contrast(1.3) brightness(.65);
  }
  90% {
    translate: -9px 2px;
    filter: grayscale(1) contrast(2) brightness(.9);
  }
  92% {
    translate: 6px -2px;
    filter: grayscale(1) contrast(1.8) brightness(.4);
  }
  96% { translate: 2px 0; }
}

@keyframes noiseMove {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-2%, 1%); }
  50% { transform: translate(1%, -2%); }
  75% { transform: translate(2%, 2%); }
  100% { transform: translate(-1%, -1%); }
}

@keyframes glitch {
  0%, 91%, 93%, 100% { opacity: 0; }
  92% {
    opacity: .7;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 38px,
      #ddd5 39px 43px,
      transparent 44px 80px
    );
    transform: translateX(4px);
  }
}

@keyframes flicker {
  0%, 95%, 97%, 100% { opacity: 1; }
  96% { opacity: .25; }
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  #face {
    object-position: 48% center;
  }

  #play {
    top: 62%;
    font-size: 22px;
    letter-spacing: 7px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #face, #noise, #glitch, #play {
    animation-duration: 12s;
  }
}
</style>
</head>

<body>
<div id="screen">

  <img id="face" src="face.jpg" alt="">

  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="noise"></div>
  <div id="glitch"></div>

  <button id="play" onclick="startGame()">PLAY</button>

  <div id="ending">
    CONNECTION ESTABLISHED
  </div>

  <!-- Аудио -->
  <audio id="menuMusic" src="music.mp3" preload="auto"></audio>

</div>

<script>
// --- СКРИПТ МУЗЫКИ ---
const music = document.getElementById('menuMusic');

const FADE_IN = 3;    // Плавное начало, секунды
const FADE_OUT = 3;   // Плавный конец, секунды
const PAUSE = 2;      // Пауза между повторами, секунды
const VOLUME = 0.45;  // Максимальная громкость

let stopped = false;
let playing = false;

music.volume = 0;

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fadeTo(target, seconds) {
  const start = music.volume;
  const steps = 30;

  for (let i = 1; i <= steps; i++) {
    if (stopped) return;

    music.volume = start + (target - start) * i / steps;
    await wait(seconds * 1000 / steps);
  }
}

async function playMenuMusic() {
  if (playing) return;
  playing = true;

  try {
    await music.play();
  } catch {
    playing = false;
    return;
  }

  while (!stopped) {
    music.volume = 0;
    await fadeTo(VOLUME, FADE_IN);

    if (stopped) break;

    while (!music.ended && !stopped) {
      if (music.duration - music.currentTime <= FADE_OUT) {
        await fadeTo(0, FADE_OUT);
        break;
      }
      await wait(100);
    }

    music.pause();

    if (stopped) break;

    await wait(PAUSE * 1000);

    if (stopped) break;

    music.currentTime = 0;

    try {
      await music.play();
    } catch {
      break;
    }
  }

  playing = false;
}

// Запуск после первого взаимодействия с меню
document.addEventListener('pointerdown', function startOnce() {
  document.removeEventListener('pointerdown', startOnce);
  playMenuMusic();
});

// --- ИГРОВАЯ ЛОГИКА ---
function startGame() {
  // Показываем надпись и прячем кнопку
  document.getElementById('ending').style.display = 'flex';
  document.getElementById('play').style.display = 'none';

  // Плавно выключаем музыку
  stopped = true;
  music.pause();

  const fade = setInterval(() => {
    music.volume = Math.max(0, music.volume - 0.05);
    if (music.volume <= 0) clearInterval(fade);
  }, 100);

  // Ждем 2.5 секунды и переходим на страницу с историей
  setTimeout(() => {
    window.location.href = 'story.html';
  }, 2500); 
}
</script>
</body>
</html>
