<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: black;
}

.menu {
  position: relative;
  width: 100%;
  height: 500px;
  overflow: hidden;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
}

.face {
  position: absolute;
  inset: -5%;
  background-image: url('ССЫЛКА_НА_ФОТО');
  background-size: cover;
  background-position: center 35%;
  filter: grayscale(1) contrast(1.3) brightness(.7);
  animation: breathe 7s infinite, glitch 9s infinite;
}

.noise {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    #fff2 4px
  );
  opacity: .3;
  animation: staticNoise .15s infinite;
}

.play {
  position: relative;
  z-index: 2;
  margin-top: 200px;
  border: 0;
  background: transparent;
  color: white;
  font: 24px monospace;
  letter-spacing: 8px;
  cursor: pointer;
  text-shadow: 0 0 8px white;
  animation: blink 3s infinite;
}

.play:hover {
  color: #aaa;
  text-shadow: 0 0 15px white;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.09); }
}

@keyframes glitch {
  0%, 91%, 94%, 100% {
    translate: 0;
  }
  92% { translate: -7px 2px; }
  93% { translate: 5px -2px; }
}

@keyframes staticNoise {
  0% { opacity: .15; }
  50% { opacity: .35; }
  100% { opacity: .2; }
}

@keyframes blink {
  0%, 94%, 100% { opacity: 1; }
  95%, 97% { opacity: .3; }
}
</style>

<div class="menu">
  <div class="face"></div>
  <div class="noise"></div>
  <button class="play"
    onclick="this.innerText='...'; this.style.pointerEvents='none'">
    PLAY
  </button>
</div>
