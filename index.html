<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #ddd;
  font-family: monospace;
}

#screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #030303;
  isolation: isolate;
}

#face {
  position: absolute;
  inset: -5%;
  width: 110%;
  height: 110%;
  object-fit: cover;
  object-position: center 35%;
  filter: grayscale(1) contrast(1.3) brightness(.65);
  animation: breathing 7s ease-in-out infinite,
             shaking 11s steps(1) infinite;
  pointer-events: none;
  user-select: none;
}

#vignette, #scanlines, #noise, #glitch {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#vignette {
  background: radial-gradient(
    ellipse, transparent 25%, #0008 65%, #000 110%
  );
}

#scanlines {
  opacity: .22;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 2px,
    #fff 3px,
    transparent 4px
  );
}

#noise {
  inset: -50%;
  width: 200%;
  height: 200%;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation: noiseMove .2s steps(2) infinite;
}

#glitch {
  animation: glitch 8s infinite;
}

#play {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 57%;
  transform: translate(-50%, -50%);
  padding: 18px 25px;
  border: 0;
  color: #ddd;
  background: transparent;
  font: 24px monospace;
  letter-spacing: 9px;
  cursor: pointer;
  text-shadow: 0 0 8px #fff8;
  animation: flicker 4s infinite;
}

#play:hover {
  color: white;
  text-shadow: 0 0 14px white;
}

#intro {
  display: none;
  position: absolute;
  z-index: 10;
  inset: 0;
  padding: 24px;
  background: #000;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#introText {
  max-width: 90%;
  font-size: 14px;
  line-height: 2;
  letter-spacing: 2px;
  white-space: pre-line;
  color: #aaa;
}

#finalMessage {
  display: none;
  position: absolute;
  z-index: 12;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #eee;
  font-size: clamp(20px, 5vw, 38px);
  font-weight: bold;
  letter-spacing: clamp(4px, 1.5vw, 12px);
  text-align: center;
  animation: finalGlitch 1.5s steps(1) infinite;
}

#finalMessage span {
  animation: finalFlicker 2s infinite;
}

@keyframes breathing {
  0%, 100% { transform: scale(1) translate(0, 0); }
  50% { transform: scale(1.09) translate(-.5%, .3%); }
}

@keyframes shaking {
  0%, 89%, 91%, 95%, 100% { translate: 0 0; }
  90% { translate: -9px 2px; }
  92% { translate: 6px -2px; }
  96% { translate: 2px 0; }
}

@keyframes noiseMove {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-2%, 1%); }
  50% { transform: translate(1%, -2%); }
  75% { transform: translate(2%, 2%); }
  100% { transform: translate(-1%, -1%); }
}

@keyframes glitch {
  0%, 91%, 93%, 100% {
    opacity: 0;
    background: transparent;
    transform: translateX(0);
  }
  92% {
    opacity: .7;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 38px,
      #ddd5 39px 43px,
      transparent 44px 80px
    );
    transform: translateX(4px);
  }
}

@keyframes flicker {
  0%, 95%, 97%, 100% { opacity: 1; }
  96% { opacity: .25; }
}

@keyframes finalGlitch {
  0%, 94%, 100% { transform: translateX(0); }
  95% { transform: translateX(5px); }
  97% { transform: translateX(-4px); }
}

@keyframes finalFlicker {
  0%, 90%, 92%, 100% { opacity: 1; }
  91% { opacity: .2; }
}

@media (max-width: 600px) {
  #face { object-position: 48% center; }
  #play {
    top: 62%;
    font-size: 22px;
    letter-spacing: 7px;
  }
}
  @media (prefers-reduced-motion: reduce) {
  #face, #noise, #glitch, #play {
    animation-duration: 12s;
  }
}
</style>
</head>

<body>
<div id="screen">

  <img id="face" src="face.jpg" alt="">

  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="noise"></div>
  <div id="glitch"></div>

  <button id="play">PLAY</button>

  <div id="intro">
    <div id="introText"></div>
  </div>

  <div id="finalMessage">
    <span>DON'T LOOK AWAY</span>
  </div>

  <audio id="menuMusic" src="music.mp3" preload="auto"></audio>
</div>

<script>
const music = document.getElementById("menuMusic");
const playButton = document.getElementById("play");
const intro = document.getElementById("intro");
const introText = document.getElementById("introText");
const finalMessage = document.getElementById("finalMessage");

const VOLUME = 0.45;
const FADE_IN = 3;
const FADE_OUT = 3;
const PAUSE = 2;

let stopped = false;
let musicStarted = false;
let gameStarted = false;

music.volume = 0;

const wait = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

async function fadeTo(target, seconds) {
  const start = music.volume;
  const steps = 30;

  for (let i = 1; i <= steps; i++) {
    if (stopped) return;

    music.volume = start + (target - start) * i / steps;
    await wait(seconds * 1000 / steps);
  }
}

async function playMenuMusic() {
  if (musicStarted || stopped) return;
  musicStarted = true;

  try {
    await music.play();
  } catch (error) {
    musicStarted = false;
    return;
  }

  while (!stopped) {
    music.volume = 0;
    await fadeTo(VOLUME, FADE_IN);

    if (stopped) break;

    while (!music.ended && !stopped) {
      if (music.duration &&
          music.duration - music.currentTime <= FADE_OUT) {
        await fadeTo(0, Math.max(
          0.1, music.duration - music.currentTime
        ));
        break;
      }

      await wait(100);
    }

    music.pause();
    if (stopped) break;

    await wait(PAUSE * 1000);
    if (stopped) break;

    music.currentTime = 0;

    try {
      await music.play();
    } catch (error) {
      break;
    }
  }

  musicStarted = false;
}

document.addEventListener("pointerdown", () => {
  playMenuMusic();
}, { once: true });

async function startGame() {
  if (gameStarted) return;
  gameStarted = true;

  stopped = true;
  music.pause();

  const fade = setInterval(() => {
    music.volume = Math.max(0, music.volume - 0.05);
    if (music.volume <= 0) clearInterval(fade);
  }, 100);

  playButton.style.display = "none";
  document.getElementById("face").style.display = "none";
  document.getElementById("vignette").style.display = "none";
  document.getElementById("scanlines").style.display = "none";
  document.getElementById("noise").style.display = "none";
  document.getElementById("glitch").style.display = "none";

  intro.style.display = "flex";

  const messages = [
    "INITIALIZING CONNECTION...",
    "CONNECTION ESTABLISHED.",
    "USER DETECTED: UNKNOWN",
    "RESTORING CORRUPTED FILES...",
    "WARNING: UNKNOWN PROCESS DETECTED."
  ];

  for (const message of messages) {
    introText.textContent = message;
    await wait(1500);
  }

  await wait(700);
  intro.style.display = "none";
  finalMessage.style.display = "flex";
}

playButton.addEventListener("click", startGame);
</script>
</body>
</html>
